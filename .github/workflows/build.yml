name: Build

on:
  # Feature branches run through pull_request only, so a branch push doesn't
  # produce a second, duplicate run alongside the PR run.
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Desktop build: a Linux x86_64 binary bundled with its resources.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-ttf-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          cmake --install build --prefix dist
          tar -C dist -czf Tetris-linux-x86_64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tetris-linux-x86_64
          path: Tetris-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Web build: Emscripten output (index.html + .js + .wasm + .data).
  # ---------------------------------------------------------------------------
  emscripten:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    # Official prebuilt toolchain image. This avoids downloading and unpacking
    # the emsdk toolchain on every run.
    container: emscripten/emsdk:6.0.12
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --parallel

      - name: Package
        run: |
          cd build-web
          python3 -m zipfile -c ../Tetris-web.zip \
            index.html index.js index.wasm index.data

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tetris-web
          path: Tetris-web.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish the web build to GitHub Pages on pushes to master.
  # Requires Pages to be set to "GitHub Actions" in the repo settings.
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: emscripten
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: Tetris-web
          path: site

      - name: Unpack
        run: |
          cd site
          unzip -o Tetris-web.zip
          rm Tetris-web.zip

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
